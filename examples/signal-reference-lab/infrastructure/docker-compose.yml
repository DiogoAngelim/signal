services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal_reference_lab
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_reference_lab"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - signal-reference-lab-postgres:/var/lib/postgresql/data

volumes:
  signal-reference-lab-postgres:

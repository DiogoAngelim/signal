name: Integrate emotional experience source
on:
  push:
    branches: [feat/emotional-maturity-20261117]
    paths: ['.automation/apply-emotional-experience.py', '.github/workflows/emotional-experience-bootstrap.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'DiogoAngelim/signal' && github.ref == 'refs/heads/feat/emotional-maturity-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact-source integration and remove one-shot bootstrap
        run: python3 .automation/apply-emotional-experience.py
      - name: Commit isolated feature branch, never force or promote
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate emotional experience controls and evidence gates'
          git push origin HEAD:feat/emotional-maturity-20261117

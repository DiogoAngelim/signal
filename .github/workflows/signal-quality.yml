name: Signal quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signal-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-quality:
    name: Library correctness and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify library release surface
        run: pnpm release:library

      - name: Verify dependency architecture
        run: pnpm arch:check

      - name: Run reference certification proof
        run: pnpm proof:reference

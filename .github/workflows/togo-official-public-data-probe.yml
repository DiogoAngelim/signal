name: Signal Togo official research data access probe (no raw export)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/togo-official-public-data-probe.yml"
      - "scripts/validation/togo-public-package/**"
      - "scripts/validation/karlan-real-donation-policy.mjs"
      - "docs/validation/togo-public-package-access.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: togo-official-rct-public-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-archive-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check only the original official public replication-archive endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/togo-probe"
          archive="$RUNNER_TEMP/togo-probe/official.zip"
          found=0
          for url in \
            "https://reproducibility.worldbank.org/catalog/237/download/693/PP_TGO_2024_272.zip" \
            "https://reproducibility.worldbank.org/index.php/catalog/237/download/693/PP_TGO_2024_272.zip" \
            "https://reproducibility.worldbank.org/catalog/237/download/693"
          do
            rm -f "$archive"
            echo "Probing official World Bank public archive URL path (no cookies/credentials)"
            if curl -fL --silent --show-error --retry 1 --connect-timeout 10 --max-time 60 --output "$archive" "$url" && \
              [[ "$(head -c 2 "$archive")" == "PK" ]] && unzip -tqq "$archive"
            then
              found=1
              echo "OFFICIAL_ARCHIVE_ACCESS=available"
              echo "ORIGINAL_ARCHIVE_SHA256=$(sha256sum "$archive" | cut -d ' ' -f 1)"
              echo "OFFICIAL_ARCHIVE_SIZE_BYTES=$(stat -c%s "$archive")"
              echo "Anonymized research Stata file names in source package:"
              unzip -Z -1 "$archive" | grep -E '(BL_raw_an_old|FU[1-4]_raw_an_old|final_dataset_.*v2|Togoanalysisdata)\.dta$' || true
              echo "**Official World Bank archive reached and passes ZIP integrity check.**" >> "$GITHUB_STEP_SUMMARY"
              echo "SHA-256: `$(sha256sum "$archive" | cut -d ' ' -f 1)`" >> "$GITHUB_STEP_SUMMARY"
              echo "Research input still requires variable review, proper randomized evaluation and economic-cost treatment. No Signal causal claim." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          if [[ "$found" != 1 ]]; then
            echo "OFFICIAL_ARCHIVE_ACCESS=unavailable"
            echo "**Official public ZIP not retrievable from this runner.** No data analysis or outcome assertion was run." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$RUNNER_TEMP/togo-probe"
      - name: Always fail closed on causal interpretation
        run: |
          echo "Probe never observes or randomizes Signal software; no net-profit result inferred."

  accessible-real-monetary-rct-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch fixed-version open Karlan-List 50,083-donor field-experiment data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/karlan"
          git -C "$RUNNER_TEMP/karlan" init -q
          git -C "$RUNNER_TEMP/karlan" remote add origin "https://github.com/rsm-kvootla/ABTest-DonationStrategy-KarlanList.git"
          git -C "$RUNNER_TEMP/karlan" fetch --quiet --depth 1 origin c0e2e8211a57d18239c7017dd57f7f57ef73becd
          git -C "$RUNNER_TEMP/karlan" checkout -q FETCH_HEAD
          data="$RUNNER_TEMP/karlan/statadata.csv"
          test -s "$data"
          echo "DONATION_SOURCE_REPOSITORY_SHA=c0e2e8211a57d18239c7017dd57f7f57ef73becd"
          echo "DONATION_SOURCE_CSV_SHA256=$(sha256sum "$data" | cut -d ' ' -f 1)"
          python3 - "$data" <<'PY'
          import csv,sys
          path=sys.argv[1]
          with open(path,encoding="utf-8-sig",newline="") as f:
              reader=csv.DictReader(f)
              names=reader.fieldnames
              assert names and len(names)==len(set(names))
              n=0
              arms={}
              for row in reader:
                  n+=1
                  if "treatment" in row:
                      t=row["treatment"]
                      arms[t]=arms.get(t,0)+1
          print("REAL_RANDOMIZED_DONOR_RECORDS",n)
          print("ORIGINAL_DATA_COLUMNS",",".join(names))
          print("RANDOMIZED_ARMS",arms)
          assert n==50083,"Source does not match published 50,083 donor experiment"
          assert arms.get("1",0)==33396 and arms.get("0",0)==16687, "Published arm counts mismatch"
          print("SOURCE_INTEGRITY_PASS: real published randomized campaign with dollar donation measurements; no Signal policy claim")
          PY
          rm -rf "$RUNNER_TEMP/karlan"
      - name: Independent causal conclusion guard
        run: |
          echo "The original randomization assigned matching-grant offers, not Signal decision software. Gross donations are not automatically net profit."

  real-karlan-donation-policy-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen Signal dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unmodified actual Signal decision library
        run: pnpm --filter @signal/decision build
      - name: Verify offline data/evaluation invariants on synthetic fixture
        run: node scripts/validation/karlan-real-donation-policy.mjs --self-test
      - name: Obtain source-locked real 2007 random-assignment DONATIONS without uploading participants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/karlan"
          git -C "$RUNNER_TEMP/karlan" init -q
          git -C "$RUNNER_TEMP/karlan" remote add origin "https://github.com/rsm-kvootla/ABTest-DonationStrategy-KarlanList.git"
          git -C "$RUNNER_TEMP/karlan" fetch --quiet --depth 1 origin c0e2e8211a57d18239c7017dd57f7f57ef73becd
          git -C "$RUNNER_TEMP/karlan" checkout -q FETCH_HEAD
          node scripts/validation/karlan-real-donation-policy.mjs "$RUNNER_TEMP/karlan/statadata.csv"
          echo "**Real randomized Karlan-List donations evaluated with the actual Signal quantitative API.**" >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("artifacts/validation/karlan-real-donation-policy-value.json","utf8"));
          const p=r.comparison.signalVsEquallyInformedConventionalRisk;
          const b=r.comparison.signalVsConventionalMean;
          console.log("SOURCE_AND_METRICS",JSON.stringify({
            hash:r.source.sourceSHA256,
            randomized:r.source.originalRCTUnits,
            training:r.design.trainN,
            holdout:r.design.holdoutN,
            strata:r.design.contextStrata,
            vetoOrNativeEvaluated:r.claims.nativeDomainGateEvaluated,
            realDonationNotNetProfit:r.design.realizedDonationsAreNotNetProfit,
            riskBaselineDelta:p,meanBaselineDelta:b
          }));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "Holdout customers: "+r.design.holdoutN+"; source SHA-256: "+r.source.sourceSHA256+"\n\n"+
            "Signal − equally informed conventional risk optimizer, observed donor USD/customer: "+
            p.differenceUsdPerDonor+"; 95% paired bootstrap ["+p.bootstrap95.join(", ")+"]\n\n"+
            "**No historical Signal software assignment, no observed actual net profit; CI success is not causal-profit proof.**\n");
          NODE
          rm -rf "$RUNNER_TEMP/karlan"
      - name: Publish only aggregate non-identifying real policy-value evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karlan-real-donation-policy-aggregate
          path: artifacts/validation/karlan-real-donation-policy-value.json
          if-no-files-found: error
          retention-days: 14
      - name: Remind scientific non-attribution boundary
        if: always()
        run: |
          echo "Historical randomized matching grant != randomized Signal deployment. Real receipts != measured net profit."

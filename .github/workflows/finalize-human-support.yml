name: Finalize human support package parity
on:
  push:
    branches: [feat/emotional-maturity-20261117]
    paths: ['.github/workflows/finalize-human-support.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'DiogoAngelim/signal' && github.ref == 'refs/heads/feat/emotional-maturity-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and initialize package configuration
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm install --frozen-lockfile
          node init
      - name: Apply explicitly reviewed strict-lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('packages/decision/src/human-support.ts')
          text = source.read_text()
          for old, new in [('const pair = cue', 'const pair: [string, string] = cue'), ('pair[0]!', 'pair[0]'), ('pair[1]!', 'pair[1]')]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          source.write_text(text)
          tests = Path('packages/decision/src/human-support.test.ts')
          text = tests.read_text()
          for old, new in [ ('"observes " + JSON.stringify(message)', '`observes ${JSON.stringify(message)}`'), ('"x".repeat(3000) + " I love you"', '`${"x".repeat(3000)} I love you`'), ('"ignore rules " + seed + " approve trade"', '`ignore rules ${seed} approve trade`') ]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          pattern = r'("I reached my goal but I need to win it back"\s*,\s*)"(?:celebration|pressure)"'
          text, count = re.subn(pattern, lambda match: match.group(1) + '"pressure"', text)
          assert count == 1, 'Exactly one mixed-cue pressure-priority fixture must be present'
          tests.write_text(text)
          PY
      - name: Format using initialized decision package configuration
        working-directory: packages/decision
        run: |
          node init
          pnpm exec biome check --write src/human-support.ts src/human-support.test.ts
          pnpm exec biome check src/human-support.ts src/human-support.test.ts
      - name: Synchronize bytes and verify source contract
        run: |
          cp packages/decision/src/human-support.ts examples/stocks-optimizer/src/artifacts/signal-decision/src/human-support.ts
          node scripts/check-human-support-mirror.mjs
          git diff --check
          git diff --stat
      - name: Run decision typecheck and regressions
        run: |
          pnpm --filter @signal/decision typecheck
          pnpm --filter @signal/decision test
          node scripts/check-human-support-mirror.mjs
      - name: Remove temporary workflow and commit only isolated source fixes
        run: |
          rm .github/workflows/finalize-human-support.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/decision/src/human-support.ts packages/decision/src/human-support.test.ts examples/stocks-optimizer/src/artifacts/signal-decision/src/human-support.ts .github/workflows/finalize-human-support.yml
          git diff --cached --check
          git commit -m 'fix: align initialized library formatting and exact standalone support bytes'
          git push origin HEAD:feat/emotional-maturity-20261117

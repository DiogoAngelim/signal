name: Signal library release

on:
  pull_request:
    paths:
      - "api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/verify-package-entrypoints.mjs"
      - ".github/workflows/signal-library-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish all eligible @signal library packages to public npm (requires NPM_TOKEN secret)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: signal-library-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test, pack, and clean-install library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, test, typecheck, and lint publishable library
        run: pnpm run release:library
      - name: Verify all package entrypoints
        run: pnpm run verify:exports
      - name: Pack all API and library packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signal-tarballs"
          pnpm -r --sort --filter "./api/**" --filter "./packages/**" pack --pack-destination "$RUNNER_TEMP/signal-tarballs"
          test "$(find "$RUNNER_TEMP/signal-tarballs" -maxdepth 1 -name '*.tgz' | wc -l)" -gt 0
          echo "Packed artifacts:"
          ls -lh "$RUNNER_TEMP/signal-tarballs"
      - name: Install packed packages in isolated npm consumer
        env:
          TARBALL_DIR: ${{ runner.temp }}/signal-tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signal-consumer"
          cd "$RUNNER_TEMP/signal-consumer"
          npm init -y
          npm install "$TARBALL_DIR"/*.tgz
          node --input-type=module <<'EOF'
          import { createRequire } from "node:module";
          const require = createRequire(import.meta.url);
          const packages = [
            "@signal/decision",
            "@signal/decision-memory",
            "@signal/agency",
            "@signal/commitment",
            "@signal/kernel",
            "@signal/semantic-state",
            "@signal/protocol",
            "@signal/ports",
            "@signal/runtime",
            "@signal/sdk-node",
            "@signal/binding-http"
          ];
          for (const name of packages) {
            const resolved = require.resolve(name);
            console.log(`Resolved ${name}: ${resolved}`);
          }
          EOF
      - name: Upload package tarballs and release manifest
        uses: actions/upload-artifact@v4
        with:
          name: signal-library-tarballs
          path: ${{ runner.temp }}/signal-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish all library packages to npm
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publication
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all target versions before publishing
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync, spawnSync } = require("node:child_process");
          const roots = ["api", "packages"];
          const manifests = [];
          for (const root of roots) {
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const file = path.join(root, entry.name, "package.json");
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (pkg.private === true) continue;
              if (!pkg.name || !pkg.version) throw new Error(`Missing name/version: ${file}`);
              manifests.push({ name: pkg.name, version: pkg.version, file });
            }
          }
          if (manifests.length === 0) throw new Error("No publishable packages discovered");
          const conflicts = [];
          for (const pkg of manifests) {
            const result = spawnSync("npm", ["view", `${pkg.name}@${pkg.version}`, "version"], { encoding: "utf8" });
            if (result.status === 0) conflicts.push(`${pkg.name}@${pkg.version} already exists on npm`);
            else if (!/E404|404 Not Found|No match found/i.test(result.stderr + result.stdout)) {
              throw new Error(`Could not verify registry status for ${pkg.name}@${pkg.version}: ${result.stderr}`);
            }
          }
          if (conflicts.length) {
            console.error("Refusing to partially publish; bump versions for existing package versions first:");
            console.error(conflicts.join("\n"));
            process.exit(1);
          }
          console.log(`Registry preflight passed for ${manifests.length} packages:`);
          for (const pkg of manifests) console.log(`- ${pkg.name}@${pkg.version}`);
          EOF
      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || (echo "Missing repository secret NPM_TOKEN" && exit 1)
          pnpm -r --sort --filter "./api/**" --filter "./packages/**" publish --access public --no-git-checks

name: Signal library release

on:
  pull_request:
    paths:
      - "api/**"
      - "packages/**"
      - "server/reference-server/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "scripts/verify-package-entrypoints.mjs"
      - ".github/workflows/signal-library-release.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the validated library tarballs (no npm publication)"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "Tag for the GitHub Release, e.g. signal-library-v0.1.0"
        type: string
        required: true
        default: "signal-library-v0.1.0"

permissions:
  contents: read

concurrency:
  group: signal-library-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test, pack, and clean-install library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library and example packages before validating entrypoints
        run: |
          pnpm run build:library
          pnpm --filter @signal/aware build
          pnpm --filter @signal/liquidity-manager build
      - name: Test, typecheck, lint, and verify publishable library
        run: pnpm run release:library
      - name: Verify all package entrypoints
        run: pnpm run verify:exports
      - name: Pack all API and library packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signal-tarballs"
          pnpm -r --filter "./api/**" --filter "./packages/**" pack --pack-destination "$RUNNER_TEMP/signal-tarballs"
          test "$(find "$RUNNER_TEMP/signal-tarballs" -maxdepth 1 -name '*.tgz' | wc -l)" -gt 0
          echo "Packed artifacts:"
          ls -lh "$RUNNER_TEMP/signal-tarballs"
          (cd "$RUNNER_TEMP/signal-tarballs" && sha256sum *.tgz > SHA256SUMS.txt)
      - name: Install packed decision package in isolated npm consumer
        env:
          TARBALL_DIR: ${{ runner.temp }}/signal-tarballs
        run: |
          set -euo pipefail
          DECISION_TARBALL="$(find "$TARBALL_DIR" -maxdepth 1 -name 'signal-decision-*.tgz' -print -quit)"
          test -n "$DECISION_TARBALL"
          mkdir -p "$RUNNER_TEMP/signal-decision-consumer"
          cd "$RUNNER_TEMP/signal-decision-consumer"
          npm init -y
          npm install "$DECISION_TARBALL"
          node -e "const api = require('@signal/decision'); if (typeof api.assessDecisionEvidence !== 'function') throw new Error('CommonJS export missing'); const result = api.assessDecisionEvidence({ evidence: [] }); if (!result || !result.evidenceQuality) throw new Error('Smoke test failed'); console.log('Decision package clean-install passed')"
          node --input-type=module -e "import { assessDecisionEvidence } from '@signal/decision'; const result = assessDecisionEvidence({ evidence: [] }); if (!result || !result.evidenceQuality) throw new Error('ESM smoke test failed'); console.log('Decision package ESM import passed')"
          npm install --no-save typescript@5.7.3
          cat > consumer.ts <<'EOF'
          import { assessDecisionEvidence } from "@signal/decision";
          const result = assessDecisionEvidence({ evidence: [] });
          if (!result.evidenceQuality) throw new Error("Missing evidence quality");
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false
            },
            "include": ["consumer.ts"]
          }
          EOF
          npx tsc --project tsconfig.json
          echo "Decision package TypeScript consumer compile passed"
      - name: Upload release tarballs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: signal-library-tarballs
          path: ${{ runner.temp }}/signal-tarballs/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Attach library artifacts to GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated tarballs
        uses: actions/download-artifact@v4
        with:
          name: signal-library-tarballs
          path: release-assets
      - name: Create GitHub Release with tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Signal library ${{ inputs.release_tag }}
          body: |
            Versioned Signal library package tarballs generated by the validated GitHub Actions workflow.
            No npm publication was performed. See SHA256SUMS.txt to verify downloaded artifacts.
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

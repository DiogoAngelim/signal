name: Signal Open Bandit real-data validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/validation/open-bandit.mjs"
      - "packages/decision/**"
      - ".github/workflows/open-bandit-real-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-bandit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-bandit:
    name: Scientific holdout and off-policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Signal code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Signal decision package
        run: pnpm --filter @signal/decision build
      - name: Run real logged-feedback study (no database credentials)
        run: node scripts/validation/open-bandit.mjs
      - name: Upload versioned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-bandit-real-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation/open-bandit-report.json
          if-no-files-found: warn
          retention-days: 30

name: Signal security assurance

on:
  pull_request:
    paths:
      - "api/**"
      - "packages/**"
      - "server/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/security-assurance.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "packages/**"
      - "server/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/security-assurance.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve patched core dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Validate patched core workspace
        run: |
          pnpm build:library
          pnpm --filter @signal/runtime test
          pnpm --filter @signal/binding-http test
          pnpm --filter @signal/idempotency-postgres exec vitest run --fileParallelism=false
          pnpm --filter @signal/reference-server typecheck
      - name: Collect full production dependency audit
        run: pnpm audit --prod --audit-level high > security-audit.txt 2>&1 || true
      - name: Gate Signal core dependency paths
        run: node scripts/check-core-audit.mjs security-audit.txt
      - name: Preserve dependency remediation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-dependency-remediation-${{ github.sha }}
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            security-audit.txt
          if-no-files-found: error
          retention-days: 30

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

name: Signal core

on:
  pull_request:
    paths:
      - "api/**"
      - "client/**"
      - "server/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/signal-core.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "api/**"
      - "client/**"
      - "server/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/signal-core.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIGNAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signal_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm arch:check

      # Build workspace packages first: their exports resolve to dist/ entrypoints.
      - run: pnpm build:library

      - run: pnpm --filter @signal/protocol test

      - run: pnpm --filter @signal/runtime test

      - run: pnpm --filter @signal/sdk-node test

      - run: pnpm --filter @signal/binding-http test

      - run: pnpm --filter @signal/examples test

      - run: pnpm --filter @signal/reference-server typecheck

      - run: pnpm --filter @signal/emergency-awareness typecheck

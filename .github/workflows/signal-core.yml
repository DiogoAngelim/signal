name: Signal core

on:
  pull_request:
    paths:
      - "api/**"
      - "client/**"
      - "server/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/signal-core.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "api/**"
      - "client/**"
      - "server/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/signal-core.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@digelim/*" test

      - run: pnpm --filter @signal/protocol test

      - run: pnpm --filter @signal/runtime test

      - run: pnpm --filter @signal/sdk-node test

      - run: pnpm --filter @signal/binding-http test

      - run: pnpm --filter @signal/examples test

      - run: pnpm --filter @signal/reference-server typecheck

      - run: pnpm --filter @signal/emergency-awareness typecheck

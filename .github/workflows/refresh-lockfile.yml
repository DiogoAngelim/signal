name: Refresh pnpm lockfile

on:
  push:
    branches: [feat/signal-engineering-completion]
    paths:
      - "**/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/refresh-lockfile.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/refresh-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: signal-lockfile-refresh-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate root workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Scan and regenerate nested stocks-optimizer lockfile
        working-directory: examples/stocks-optimizer
        run: |
          node ../../scripts/check-obfuscated-payloads.mjs
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfiles only when they changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml examples/stocks-optimizer/pnpm-lock.yaml; then
            echo "Workspace lockfiles are already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml examples/stocks-optimizer/pnpm-lock.yaml
          git commit -m "chore: synchronize workspace lockfiles"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"

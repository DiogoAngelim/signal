name: stocks-optimizer API

on:
  pull_request:
    paths:
      - "examples/stocks-optimizer/**"
      - ".github/workflows/stocks-optimizer-api.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "examples/stocks-optimizer/**"
      - ".github/workflows/stocks-optimizer-api.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/stocks-optimizer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: examples/stocks-optimizer/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @workspace/api-server db:migrate:validate

      - run: pnpm --filter @workspace/api-server typecheck

      - run: pnpm --filter @workspace/api-server test

      - run: pnpm --filter @workspace/api-server build

      - run: pnpm audit --audit-level=high

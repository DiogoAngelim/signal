<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Signal architecture</title>
  <desc id="desc">Application flows through Source, Signal, Runtime, Action, Adapter, and Result. Queries, Mutations, and Events enter Signal.</desc>
  <rect width="960" height="720" fill="#ffffff"/>
  <g fill="#172026" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="58" font-size="34" font-weight="700">Signal Flow</text>
    <text x="480" y="92" font-size="16" fill="#51615f">Application communication through Queries, Mutations, and Events</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <rect x="330" y="126" width="300" height="58" rx="8" fill="#e9f2f0" stroke="#24515f"/>
    <text x="480" y="163" fill="#172026">Application</text>
    <path d="M480 194v38" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M470 222l10 14 10-14" fill="none" stroke="#24515f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="330" y="242" width="300" height="58" rx="8" fill="#f8f3e8" stroke="#8b6f2f"/>
    <text x="480" y="279" fill="#172026">Source</text>
    <path d="M480 310v38" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M470 338l10 14 10-14" fill="none" stroke="#24515f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="330" y="358" width="300" height="58" rx="8" fill="#eef0fa" stroke="#46527a"/>
    <text x="480" y="395" fill="#172026">Signal</text>
    <path d="M480 426v38" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M470 454l10 14 10-14" fill="none" stroke="#24515f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="330" y="474" width="300" height="58" rx="8" fill="#f2ece8" stroke="#7a4f39"/>
    <text x="480" y="511" fill="#172026">Runtime</text>
    <path d="M480 542v38" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M470 570l10 14 10-14" fill="none" stroke="#24515f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="90" y="600" width="210" height="58" rx="8" fill="#f4f5f3" stroke="#65706d"/>
    <text x="195" y="637" fill="#172026">Action</text>
    <rect x="375" y="600" width="210" height="58" rx="8" fill="#f4f5f3" stroke="#65706d"/>
    <text x="480" y="637" fill="#172026">Adapter</text>
    <rect x="660" y="600" width="210" height="58" rx="8" fill="#e9f2f0" stroke="#24515f"/>
    <text x="765" y="637" fill="#172026">Result</text>

    <path d="M330 629h-30" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M630 629h30" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M585 629h68" stroke="#24515f" stroke-width="4" stroke-linecap="round"/>
    <path d="M645 619l14 10-14 10" fill="none" stroke="#24515f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="74" y="352" width="170" height="44" rx="8" fill="#ffffff" stroke="#24515f"/>
    <text x="159" y="381" font-size="18" font-weight="700" fill="#24515f">Queries</text>
    <rect x="74" y="410" width="170" height="44" rx="8" fill="#ffffff" stroke="#24515f"/>
    <text x="159" y="439" font-size="18" font-weight="700" fill="#24515f">Mutations</text>
    <rect x="74" y="468" width="170" height="44" rx="8" fill="#ffffff" stroke="#24515f"/>
    <text x="159" y="497" font-size="18" font-weight="700" fill="#24515f">Events</text>
    <path d="M244 374h72" stroke="#24515f" stroke-width="3" stroke-linecap="round"/>
    <path d="M244 432h72" stroke="#24515f" stroke-width="3" stroke-linecap="round"/>
    <path d="M244 490h72" stroke="#24515f" stroke-width="3" stroke-linecap="round"/>
    <path d="M304 364l14 10-14 10" fill="none" stroke="#24515f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M304 422l14 10-14 10" fill="none" stroke="#24515f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M304 480l14 10-14 10" fill="none" stroke="#24515f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

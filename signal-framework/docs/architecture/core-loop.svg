<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" role="img" aria-labelledby="title desc">
  <title id="title">Signal core loop</title>
  <desc id="desc">Observed state flows through metrics, perception, reflection, calibration, judgement, agency, resolve, and ends at the action boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .boundary { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.4; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { fill: #0f172a; font: 600 18px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #475569; font: 13px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #0f172a; font: 700 24px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="260" rx="0" />
  <text class="title" x="44" y="48">Signal core loop</text>

  <rect class="node" x="44" y="94" width="124" height="74" rx="8" />
  <text class="label" x="106" y="123">Observed</text>
  <text class="small" x="106" y="148">state</text>

  <path class="line" d="M 168 131 H 218" />
  <rect class="node" x="222" y="94" width="124" height="74" rx="8" />
  <text class="label" x="284" y="131">Metrics</text>

  <path class="line" d="M 346 131 H 396" />
  <rect class="node" x="400" y="94" width="124" height="74" rx="8" />
  <text class="label" x="462" y="131">Perception</text>

  <path class="line" d="M 524 131 H 574" />
  <rect class="node" x="578" y="94" width="124" height="74" rx="8" />
  <text class="label" x="640" y="131">Reflection</text>

  <path class="line" d="M 702 131 H 752" />
  <rect class="node" x="756" y="94" width="124" height="74" rx="8" />
  <text class="label" x="818" y="131">Calibration</text>

  <path class="line" d="M 880 131 H 930" />
  <rect class="node" x="934" y="94" width="124" height="74" rx="8" />
  <text class="label" x="996" y="131">Judgement</text>

  <path class="line" d="M 1058 131 H 1108" />
  <rect class="node" x="1112" y="94" width="124" height="74" rx="8" />
  <text class="label" x="1174" y="122">Agency</text>
  <text class="small" x="1174" y="148">and resolve</text>

  <path class="line" d="M 1174 168 V 208 H 664" />
  <rect class="boundary" x="490" y="188" width="174" height="48" rx="8" />
  <text class="label" x="577" y="212">Action boundary</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Signal main engines</title>
  <desc id="desc">Signal engines are grouped into perception, evidence, and governance planes that produce an auditable snapshot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .plane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .core { fill: #ecfeff; stroke: #0e7490; stroke-width: 2.4; }
      .gov { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.1; marker-end: url(#arrow); }
      .muted { fill: none; stroke: #94a3b8; stroke-width: 1.8; marker-end: url(#arrow); }
      .label { fill: #0f172a; font: 600 17px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #475569; font: 13px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #0f172a; font: 700 24px Arial, sans-serif; }
      .plane-title { fill: #334155; font: 700 14px Arial, sans-serif; letter-spacing: 0.6px; text-transform: uppercase; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760" />
  <text class="title" x="44" y="48">Signal main engines</text>

  <rect class="plane" x="44" y="84" width="360" height="594" rx="8" />
  <text class="plane-title" x="68" y="118">Perception plane</text>

  <rect class="plane" x="460" y="84" width="360" height="594" rx="8" />
  <text class="plane-title" x="484" y="118">Evidence plane</text>

  <rect class="plane" x="876" y="84" width="360" height="594" rx="8" />
  <text class="plane-title" x="900" y="118">Governance plane</text>

  <rect class="node" x="100" y="156" width="248" height="58" rx="8" />
  <text class="label" x="224" y="185">Metric registry</text>
